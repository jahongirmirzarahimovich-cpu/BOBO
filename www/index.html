<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<title>Bobo — aqlli kassa va ombor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--cd:rgba(16,24,43,.78);--cd2:#111a2e;--in:#0c1424;--ln:rgba(148,163,184,.15);--ln2:rgba(148,163,184,.28);--ink:#e7eef9;--mt:#8b98b1;
--cy:#22d3ee;--bl:#3b82f6;--vi:#8b5cf6;--em:#10b981;--am:#f59e0b;--ro:#f43f5e;--ok:#22c55e;--r:16px;
--grad:linear-gradient(135deg,#06b6d4 0%,#3b82f6 55%,#8b5cf6 100%);--sh:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Manrope,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);font-size:15px;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums;min-height:100vh;
background:radial-gradient(1100px 600px at 0% -10%,rgba(34,211,238,.13),transparent 60%),radial-gradient(900px 600px at 105% 0%,rgba(139,92,246,.16),transparent 60%),radial-gradient(800px 500px at 50% 120%,rgba(16,185,129,.08),transparent 60%),var(--bg);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(148,163,184,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.045) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 85%)}
#app{position:relative;z-index:1}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font:inherit;color:inherit}
select option,select optgroup{background:#0f1729;color:var(--ink)}
h1,h2,h3{margin:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.brandname{font-family:'Space Grotesk',Manrope,sans-serif;letter-spacing:.02em}
.gtext{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* layout */
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));position:sticky;top:0;z-index:25;background:rgba(7,11,20,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.top:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--grad);opacity:.7}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand b{display:block;font-size:17px;white-space:nowrap}.brand small{color:var(--mt);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.sp{flex:1}
.pill{font-size:12px;padding:6px 11px;border-radius:99px;background:rgba(148,163,184,.1);border:1px solid var(--ln);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-weight:600}
.pill.warn{background:rgba(244,63,94,.14);border-color:rgba(244,63,94,.4);color:#fda4af}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}.dot.err{background:var(--ro);box-shadow:0 0 10px var(--ro)}.dot.local{background:var(--am);box-shadow:0 0 10px var(--am)}.dot.wait{background:#64748b;box-shadow:none}
.uchip{background:rgba(148,163,184,.1);border:1px solid var(--ln);padding:7px 12px;border-radius:99px;font-weight:700;font-size:13px;white-space:nowrap}
.hbtn{flex:none;width:36px;height:36px;border-radius:12px;background:rgba(148,163,184,.1);border:1px solid var(--ln);display:inline-flex;align-items:center;justify-content:center}
.wrap{display:flex;align-items:flex-start}
.side{width:236px;padding:14px 10px;display:flex;flex-direction:column;gap:3px;background:rgba(10,16,30,.6);backdrop-filter:blur(12px);border-right:1px solid var(--ln);position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto;flex:none}
.nv{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;font-weight:600;color:var(--mt);text-align:left;position:relative;transition:background .15s,color .15s}
.nv:hover{background:rgba(148,163,184,.08);color:var(--ink)}
.nv.on{background:linear-gradient(135deg,rgba(6,182,212,.22),rgba(59,130,246,.2));color:#fff;box-shadow:inset 0 0 0 1px rgba(34,211,238,.35),0 0 24px rgba(34,211,238,.12)}
.nv .bd{margin-left:auto;background:var(--ro);color:#fff;border-radius:99px;font-size:11px;padding:2px 7px;font-weight:800;box-shadow:0 0 12px rgba(244,63,94,.6)}
main{flex:1;padding:20px;min-width:0;max-width:1440px}
@media(max-width:899px){
 .side{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;flex-direction:row;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--ln);z-index:30;gap:2px;background:rgba(7,11,20,.92)}
 .nv{flex-direction:column;gap:3px;font-size:11px;padding:7px 8px;min-width:72px;align-items:center;flex:1}
 .nv .bd{position:absolute;top:2px;right:8px}
 main{padding:12px 12px 96px}
 .uchip span,.brand small,.hide-m{display:none}
 .top{gap:5px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top))}.brand b span{display:none}.brand b{font-size:15px}.pill{padding:6px 8px;gap:4px}.hbtn{width:34px;height:34px}.uchip{padding:7px 9px;max-width:70px;overflow:hidden;text-overflow:ellipsis}
}
/* common */
.pt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.pt h2{font-size:22px;font-weight:800;margin-right:auto;letter-spacing:-.01em}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card h3{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;font-weight:700;background:rgba(148,163,184,.12);border:1px solid var(--ln);color:var(--ink);white-space:nowrap;min-height:44px;transition:transform .06s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 22px rgba(59,130,246,.35)}
.btn.ok{background:linear-gradient(135deg,#10b981,#059669);border-color:transparent;color:#fff;box-shadow:0 6px 20px rgba(16,185,129,.3)}
.btn.dang{background:rgba(244,63,94,.12);border-color:rgba(244,63,94,.35);color:#fda4af}.btn.dang.f{background:linear-gradient(135deg,#f43f5e,#e11d48);color:#fff;border-color:transparent}
.btn.gold{background:linear-gradient(135deg,#f59e0b,#d97706);color:#1a1200;border-color:transparent}.btn.fz{background:linear-gradient(135deg,#06b6d4,#0891b2);color:#fff;border-color:transparent}
.btn.gh{background:transparent}
.btn.sm{padding:7px 11px;min-height:34px;font-size:13px;border-radius:10px}
.grow{flex:1}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp{width:100%;padding:11px 12px;border:1px solid var(--ln2);border-radius:12px;background:var(--in);outline:none;min-height:44px;color-scheme:dark}
.inp:focus{border-color:var(--cy);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
label.f{display:block;font-size:12px;font-weight:700;color:var(--mt);margin:10px 0 5px;text-transform:uppercase;letter-spacing:.04em}
.mut{color:var(--mt)}.sm{font-size:13px}.r{text-align:right}.b{font-weight:800}
.neg{color:#fb7185!important;font-weight:800}
.empty{padding:26px;text-align:center;color:var(--mt)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(148,163,184,.14);color:var(--ink);white-space:nowrap;border:1px solid transparent}
.badge.ok{background:rgba(34,197,94,.14);color:#86efac;border-color:rgba(34,197,94,.3)}.badge.wr{background:rgba(245,158,11,.14);color:#fcd34d;border-color:rgba(245,158,11,.3)}.badge.an{background:rgba(244,63,94,.14);color:#fda4af;border-color:rgba(244,63,94,.3)}.badge.lz{background:rgba(59,130,246,.16);color:#93c5fd;border-color:rgba(59,130,246,.3)}.badge.fz{background:rgba(34,211,238,.14);color:#67e8f9;border-color:rgba(34,211,238,.3)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;color:var(--mt);font-weight:700;padding:8px;border-bottom:1px solid var(--ln2);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--ln);vertical-align:middle}
.tbl tr.cl{cursor:pointer}.tbl tr.cl:hover td{background:rgba(34,211,238,.05)}
.tw{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--cd);border:1px solid var(--ln);border-radius:var(--r);padding:13px 14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:var(--c,var(--grad));box-shadow:0 0 14px var(--c,#22d3ee)}
.kpi small{display:block;color:var(--mt);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em}.kpi b{display:block;font-size:22px;font-weight:800;margin-top:5px}.kpi em{font-style:normal;font-size:12px;color:var(--mt)}
.bar{height:8px;background:rgba(148,163,184,.12);border-radius:99px;overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--grad);border-radius:99px;box-shadow:0 0 10px rgba(34,211,238,.5)}
.hours{display:flex;align-items:flex-end;gap:4px;height:130px;padding-top:6px}
.hours div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:10px;color:var(--mt);max-width:48px}
.hours i{display:block;width:100%;background:linear-gradient(180deg,#22d3ee,#3b82f6);border-radius:6px 6px 2px 2px;min-height:2px;box-shadow:0 0 12px rgba(34,211,238,.35)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:1000px){.g2{grid-template-columns:1fr}}
.g3{display:grid;grid-template-columns:2fr 1fr;gap:14px}@media(max-width:1100px){.g3{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{padding:8px 14px;border-radius:99px;background:rgba(148,163,184,.08);border:1px solid var(--ln);font-weight:700;font-size:13px;white-space:nowrap;color:var(--mt)}
.chip.on{background:rgba(34,211,238,.15);color:#a5f3fc;border-color:rgba(34,211,238,.45)}
.banner{padding:11px 14px;border-radius:12px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#fcd34d;font-weight:600;font-size:13px;margin-bottom:12px}
.banner.an{background:rgba(244,63,94,.1);border-color:rgba(244,63,94,.35);color:#fda4af}.banner.ok{background:rgba(34,211,238,.08);border-color:rgba(34,211,238,.3);color:#a5f3fc}
/* POS */
.pos{display:grid;grid-template-columns:1fr 390px;gap:16px;align-items:start}
.ctabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.ctab{padding:9px 13px;border-radius:13px;background:var(--cd);border:1px solid var(--ln);font-weight:700;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;min-width:100px}
.ctab em{font-style:normal;font-size:12px;color:var(--mt);font-weight:600}
.ctab.on{border-color:rgba(34,211,238,.6);background:rgba(34,211,238,.1);box-shadow:0 0 18px rgba(34,211,238,.15)}
.ctab.add{border-style:dashed;color:var(--cy);justify-content:center;align-items:center}
.srch{margin-bottom:8px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:9px;margin-top:8px}
.pc{background:var(--cd);border:1px solid var(--ln);border-radius:var(--r);padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:122px;position:relative;box-shadow:var(--sh);transition:border-color .15s,transform .06s}
.pc:hover{border-color:rgba(34,211,238,.4)}.pc:active{transform:scale(.98)}
.pc.in{border-color:rgba(16,185,129,.6);background:rgba(16,185,129,.08)}
.pc.off{opacity:.55;border-style:dashed}.pc.off .pr{color:var(--mt)}
.pc .pcat{font-size:10px;color:var(--mt);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.pc b{font-size:15px;line-height:1.25}.pc .pr{font-weight:800;color:#67e8f9;margin-top:auto}.pc .pr small{font-weight:600;color:var(--mt)}
.pc .st{font-size:11px;color:var(--mt)}.pc .st.no{color:#fda4af;font-weight:800}
.pc .qb{position:absolute;top:8px;right:8px;background:var(--em);color:#04120c;border-radius:99px;padding:2px 8px;font-size:12px;font-weight:800}
.cart{background:var(--cd);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh);position:sticky;top:75px;display:flex;flex-direction:column;max-height:calc(100vh - 92px);overflow:hidden;backdrop-filter:blur(12px)}
.ch{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--ln);background:rgba(148,163,184,.05)}
.ch b{margin-right:auto}.ch .tot{font-weight:800;color:#67e8f9}.ch .tg{display:none}
.cbody{overflow:auto;flex:1;padding:4px 10px}
.ci{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;padding:10px 4px;border-bottom:1px dashed var(--ln)}
.ci small{display:block;color:var(--mt);font-size:12px}
.ib{width:36px;height:36px;border-radius:10px;background:rgba(148,163,184,.12);font-weight:800}.ib.x{background:rgba(244,63,94,.14);color:#fda4af}
.cfoot{padding:12px 14px;border-top:1px solid var(--ln);background:rgba(148,163,184,.04)}
.big{font-size:30px;font-weight:800;margin-bottom:10px;letter-spacing:-.01em}.big small{font-size:14px;color:var(--mt)}
/* modal */
#modal .ov{position:fixed;inset:0;background:rgba(2,6,15,.7);backdrop-filter:blur(6px);z-index:60;display:flex;align-items:center;justify-content:center;padding:14px;animation:fd .15s}
@keyframes fd{from{opacity:0}}
.mdl{background:linear-gradient(180deg,#121b30,#0d1526);border:1px solid var(--ln2);border-radius:20px;width:100%;max-width:460px;max-height:calc(100vh - 28px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(34,211,238,.06);animation:up .18s}
.mdl.w{max-width:740px}
@keyframes up{from{transform:translateY(16px);opacity:.6}}
.mh{padding:16px 18px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:#121b30;z-index:1}.mh h3{font-size:17px;font-weight:800;margin-right:auto}
.mb{padding:16px 18px}.mf{padding:12px 18px 18px;display:flex;gap:8px;flex-wrap:wrap}
.disp{background:var(--in);border:1px solid var(--ln2);border-radius:14px;padding:12px 16px;text-align:right}
.disp b{font-size:36px;font-weight:800;display:block;min-height:44px;font-family:'Space Grotesk',Manrope}.disp small{color:var(--mt);font-weight:600}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kp button{height:58px;border-radius:14px;background:rgba(148,163,184,.08);border:1px solid var(--ln);font-size:23px;font-weight:700;font-family:'Space Grotesk',Manrope}
.kp button:active{background:rgba(34,211,238,.18);border-color:var(--cy)}
.seg{display:flex;background:rgba(148,163,184,.08);border:1px solid var(--ln);border-radius:12px;padding:3px;gap:3px;margin-bottom:10px}.seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;font-size:13px;color:var(--mt)}.seg button.on{background:rgba(34,211,238,.16);color:#a5f3fc}
.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.paybtn{padding:16px 6px;border-radius:14px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--ln2);background:rgba(148,163,184,.06)}
.paybtn.on{border-color:var(--cy);box-shadow:0 0 18px rgba(34,211,238,.25)}
.or{display:flex;align-items:center;gap:10px;color:var(--mt);font-size:13px;margin:14px 0}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--ln)}
.err{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.4);color:#fda4af;font-weight:700;font-size:14px}
/* login */
.login{min-height:100vh;display:flex;flex-direction:column}
.lhead{text-align:center;padding:52px 16px 26px;padding-top:calc(52px + env(safe-area-inset-top))}
.lhead h1{font-size:40px;font-weight:700;margin-top:14px}.lhead p{color:var(--mt);margin:6px 0 0}
.lbody{max-width:780px;width:100%;margin:0 auto;padding:12px 16px 30px}
.lbody h3{font-size:16px;margin-bottom:12px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}
.stf{background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--sh);transition:border-color .15s}
.stf:hover{border-color:rgba(34,211,238,.45)}
.av{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;background:linear-gradient(135deg,#10b981,#06b6d4)}
.av.admin{background:var(--grad)}.av.wh{background:linear-gradient(135deg,#f59e0b,#f43f5e)}
.stf small{color:var(--mt);font-size:12px}
.dots{display:flex;justify-content:center;gap:14px;margin:10px 0 4px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--cy)}.dots i.f{background:var(--cy);box-shadow:0 0 12px var(--cy)}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.logo{width:84px;height:84px;margin:0 auto;display:block;filter:drop-shadow(0 0 26px rgba(34,211,238,.45))}
.gate{max-width:480px;margin:40px auto;text-align:center}
.gate .card{padding:26px}
.pulse{animation:pl 1.6s infinite}@keyframes pl{50%{opacity:.45}}
/* list cards */
.lc{background:rgba(148,163,184,.05);border:1px solid var(--ln);border-radius:14px;padding:13px 14px;margin-bottom:9px}
.lc .lh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.lc .lh b{font-size:15px}
.lc .its{font-size:13px;color:var(--mt);margin:6px 0 8px;line-height:1.5}
.sum{font-weight:800;font-size:17px;margin-left:auto}
#toasts{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
.toast{background:#111a2e;border:1px solid var(--ln2);border-left:3px solid var(--cy);color:#fff;padding:12px 15px;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.5);font-weight:600;font-size:14px;animation:up .2s}
.toast.ok{border-left-color:var(--em)}.toast.err{border-left-color:var(--ro)}
.frow{display:grid;grid-template-columns:1fr 130px 44px;gap:8px;margin-bottom:8px;align-items:center}
.stk{max-height:420px;overflow:auto}
.steps{margin:0;padding-left:20px;line-height:1.7}.steps li{margin-bottom:6px}

/* ===== responsive v4 ===== */
.m-only{display:none!important}
.tabbar,.cartbar{display:none}
.avbtn{position:relative;padding:0;border-radius:14px}.avbtn .av{width:38px;height:38px;font-size:14px;border-radius:12px}
.bdot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--ro);color:#fff;font-style:normal;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 10px rgba(244,63,94,.6)}

function toast(html,cls){const box=$('#toasts');while(box.children.length>=2)box.firstChild.remove();const t=document.createElement('div');t.className='toast '+(cls||'');t.innerHTML=html;t.onclick=()=>t.remove();box.appendChild(t);setTimeout(()=>t.remove(),3500)}

 const head=`<div class="pt"><h2>Savdolar jurnali</h2><input type="date" id="sd" class="inp" style="width:auto" value="${f.date}" data-ch="sfDate">

 <select id="sst" class="inp" style="width:auto" data-ch="sfSt">${[['all','Barchasi'],['pend','Tasdiqlanmagan'],['edit','Tahrirlangan'],['void','Bekor qilingan'],['ret','Qaytarishli'],['wh','Ombordan']].map(([k,t])=>`<option value="${k}" ${f.st===k?'selected':''}>${t}</option>`).join('')}</select></div>`;
 if(!ev)return head+'<div class="card empty">Yuklanmoqda…</div>';

 <div class="card"><div class="tw"><table class="tbl"><tr><th>#</th><th>Vaqt</th><th>Xodim</th><th>Mahsulotlar</th><th class="r">Summa</th><th>Holat</th></tr>
 ${list.map(s=>`<tr class="cl" data-a="saleOpen" data-id="${s.id}"><td><b>${s.no}</b></td><td>${tm(s.t)}</td><td>${esc(sname(s.by))}</td><td class="sm mut">${itemsTxt(s.items)}</td><td class="r b">${fm(s.total-s.returned)}</td><td>${saleStatus(s)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Savdo topilmadi</td></tr>'}</table></div></div>
 ${cancels.length?`<div class="card"><h3>Savatda bekor qilingan sotuvlar <span class="badge an">${cancels.length}</span></h3>${cancels.map(e=>`<div class="lc"><div class="lh"><b>${esc(sname(e.by))}</b><span class="mut sm">${tm(e.t)} · ${esc(e.cust||'')}</span><span class="sum">${fm(e.total)}</span></div><div class="its">${itemsTxt(e.items||[])}</div></div>`).join('')}</div>`:''}`}

function vStock(){const ql=S.sq.toLowerCase();const ps=prods().filter(p=>!ql||p.name.toLowerCase().includes(ql));const st=S.st.stock;
 let val=0;ps.forEach(p=>{const s=st[p.id]||{wh:0,shop:0};val+=((s.wh||0)+(s.shop||0))*p.price});
 const neg=ps.filter(p=>{const s=st[p.id]||{};return (s.wh||0)<0||(s.shop||0)<0});const sa=stockAlerts();
 const moves=S.events.filter(e=>['wh_in','transfer','transfer_ok','transfer_no','adjust','restock_req'].includes(e.type)).slice(-40).reverse();
 const mv=e=>({wh_in:'Omborga kirim',transfer:'Oʻtkazish soʻrovi',transfer_ok:'Doʻkonga oʻtkazildi',transfer_no:'Oʻtkazish rad etildi',adjust:'Tuzatish',restock_req:'Avto-zayavka'})[e.type];
 return `<div class="pt"><h2>${isAdmin()?'Ombor va doʻkon qoldigʻi':'Ombor qoldigʻi'}</h2>
 <button class="btn pri" data-a="go" data-v="whin">${ic('in')} Omborga kirim</button><button class="btn fz" data-a="go" data-v="trans">${ic('truck')} Doʻkonga oʻtkazish</button><button class="btn gold" data-a="poNew">${ic('bell')} Ishlab chiqaruvchiga zayavka</button>${isAdmin()?`<button class="btn gh" data-a="adjOpen">Tuzatish / inventarizatsiya</button>`:''}</div>
 ${sa.out.length?`<div class="banner an">Doʻkonda tugagan: ${sa.out.length} ta mahsulot. Omborda bor boʻlganlariga avtomatik zayavka ketadi.</div>`:''}
 ${neg.length?`<div class="banner">⚠ ${neg.length} ta mahsulotda manfiy qoldiq bor — inventarizatsiya qiling.</div>`:''}
 ${isAdmin()?`<div class="kpis"><div class="kpi"><small>Qoldiq qiymati (sotuv narxida)</small><b>${fm(val)}</b></div><div class="kpi" style="--c:#f43f5e"><small>Doʻkonda tugagan</small><b>${sa.out.length}</b></div><div class="kpi" style="--c:#f59e0b"><small>Kam qolgan (min. qoldiqdan past)</small><b>${sa.low.length}</b></div></div>`:''}
 <div class="card"><input id="stq" class="inp" placeholder="Qidirish…" data-in="sq" value="${esc(S.sq)}" style="margin-bottom:10px"><div class="tw"><table class="tbl"><tr><th>Mahsulot</th><th>Kategoriya</th><th class="r">Omborda</th><th class="r">Doʻkonda</th><th class="r">Jami</th><th class="r">Min.</th>${isAdmin()?'<th class="r">Narx</th>':''}</tr>
 ${ps.map(p=>{const s=st[p.id]||{wh:0,shop:0};const w=s.wh||0,h=s.shop||0;return `<tr><td><b>${esc(p.name)}</b>${p.active===false?' <span class="badge">nofaol</span>':''}</td><td class="mut">${esc(p.cat)}</td><td class="r ${w<=0?'neg':''}">${fq(w)} ${esc(p.unit)}</td><td class="r ${h<=0?'neg':''}">${h<=0&&h===0?'tugagan':fq(h)+' '+esc(p.unit)}</td><td class="r b">${fq(w+h)}</td><td class="r mut">${p.min?fq(p.min):'—'}</td>${isAdmin()?`<td class="r">${fm(p.price)}</td>`:''}</tr>`}).join('')||'<tr><td colspan="7" class="empty">Mahsulot yoʻq</td></tr>'}</table></div></div>
 <div class="card"><h3>Soʻnggi harakatlar</h3>${moves.map(e=>`<div class="lc"><div class="lh"><b>${mv(e)}</b><span class="mut sm">${df(e.date)} ${tm(e.t)} · ${esc(sname(e.by))}</span></div><div class="its">${e.type==='adjust'?`${esc(prod(e.p)?.name||'')}: ${e.q>0?'+':''}${fq(e.q)} (${e.loc==='wh'?'ombor':'doʻkon'}) — ${esc(e.reason||'')}`:e.type==='restock_req'?esc(e.n)+' — doʻkonda tugadi':itemsTxt(e.items||[])}${e.note?' · '+esc(e.note):''}</div></div>`).join('')||'<div class="empty">Harakat yoʻq</div>'}</div>`}
function formRows(kind){if(!S.forms[kind])S.forms[kind]={rows:[{p:'',q:''},{p:'',q:''},{p:'',q:''}],note:''};return S.forms[kind]}
function syncForm(kind){const F=formRows(kind);F.rows.forEach((r,k)=>{r.p=val(`f_${kind}_p_${k}`);r.q=val(`f_${kind}_q_${k}`)});F.note=val(`f_${kind}_note`);if(kind==='po')F.sup=val('f_po_sup')}
function receivedIds(){const ids=new Set();S.events.forEach(e=>{if(e.type==='wh_in')e.items.forEach(i=>ids.add(i.p))});Object.keys(S.cfg.close?.stock||{}).forEach(p=>ids.add(p));Object.keys(S.st.stock).forEach(p=>ids.add(p));return ids}
function suppliers(){const set=new Set();S.events.forEach(e=>{if(e.type==='wh_in'&&e.note)set.add(e.note);if(e.type==='po_req'&&e.supplier)set.add(e.supplier)});Object.values(S.st.pend.po).forEach(o=>o.supplier&&set.add(o.supplier));return[...set]}
function vForm(kind){if(kind==='po')return vPoForm();const F=formRows(kind);const isT=kind==='trans';
 const opts=sel=>`<option value="">— mahsulot tanlang —</option>`+[...new Set([...cats(),'Boshqalar'])].map(c=>{const ps=aprods().filter(p=>p.cat===c||(c==='Boshqalar'&&!cats().includes(p.cat)));return ps.length?`<optgroup label="${esc(c)}">${ps.map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${esc(p.name)} (${esc(p.unit)}) — omborda ${fq(stockOf(p.id,'wh'))}, doʻkonda ${fq(stockOf(p.id,'shop'))}</option>`).join('')}</optgroup>`:''}).join('');
 return `<div class="pt"><h2>${isT?'Ombordan doʻkonga oʻtkazish':'Omborga tovar kirimi'}</h2>${isAdmin()?`<button class="btn gh" data-a="go" data-v="stock">← Omborga qaytish</button>`:''}</div>
 <div class="card">${isT&&!isAdmin()?'<p class="banner ok">Oʻtkazish boshqaruvchi tasdiqlagandan soʻng ombordan chiqim va doʻkonga kirim boʻladi.</p>':''}
 ${!isT?(F.po?'<p class="banner ok">Buyurtma-zayavka boʻyicha kirim. Haqiqatda kelgan miqdorni kiriting — saqlangach zayavka yopiladi.</p>':'<p class="mut sm" style="margin-top:0">Yetkazib beruvchidan kelgan tovarni yoki boshlangʻich qoldiqni kiriting.</p>'):''}
 ${F.rows.map((r,k)=>`<div class="frow"><select id="f_${kind}_p_${k}" class="inp">${opts(r.p)}</select><input id="f_${kind}_q_${k}" class="inp" inputmode="decimal" placeholder="Miqdor" value="${esc(r.q)}"><button class="ib x" data-a="formDel" data-kind="${kind}" data-k="${k}">✕</button></div>`).join('')}
 <button class="btn sm gh" data-a="formAdd" data-kind="${kind}">+ Qator qoʻshish</button>
 <label class="f">${isT?'Izoh':'Yetkazib beruvchi / izoh'}</label><input id="f_${kind}_note" class="inp" value="${esc(F.note)}">
 <div class="row" style="margin-top:14px"><button class="btn pri grow" data-a="formSave" data-kind="${kind}">${isT?(isAdmin()?'Oʻtkazish (darhol)':'Tasdiqlashga yuborish'):'Kirimni saqlash'}</button></div></div>`}

function vPoForm(){const F=formRows('po');const rec=receivedIds();
 const ps=aprods().slice().sort((a,b)=>(rec.has(b.id)-rec.has(a.id))||a.name.localeCompare(b.name));
 const opts=sel=>`<option value="">— mahsulot tanlang —</option><optgroup label="Avval kirim qilinganlar">${ps.filter(p=>rec.has(p.id)).map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${esc(p.name)} (${esc(p.unit)}) — omborda ${fq(stockOf(p.id,'wh'))}, doʻkonda ${fq(stockOf(p.id,'shop'))}</option>`).join('')}</optgroup><optgroup label="Boshqa mahsulotlar">${ps.filter(p=>!rec.has(p.id)).map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${esc(p.name)} (${esc(p.unit)})</option>`).join('')}</optgroup>`;
 return `<div class="pt"><h2>Ishlab chiqaruvchiga zayavka</h2><button class="btn gh" data-a="go" data-v="req">← Zayavkalar</button></div>
 <div class="card"><p class="mut sm" style="margin-top:0">Qaysi mahsulotdan yana qancha kerakligini yozing. Zayavka boshqaruvchiga tasdiqlash uchun boradi${isAdmin()?' (siz yaratsangiz — darhol tasdiqlanadi)':''}.</p>
 <label class="f">Ishlab chiqaruvchi / yetkazib beruvchi</label><input id="f_po_sup" class="inp" list="supl" value="${esc(F.sup||'')}" placeholder="Masalan: «Kolbasa zavodi» MCHJ"><datalist id="supl">${suppliers().map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
 <label class="f">Mahsulotlar va kerakli miqdor</label>
 ${F.rows.map((r,k)=>`<div class="frow"><select id="f_po_p_${k}" class="inp">${opts(r.p)}</select><input id="f_po_q_${k}" class="inp" inputmode="decimal" placeholder="Qancha kerak" value="${esc(r.q)}"><button class="ib x" data-a="formDel" data-kind="po" data-k="${k}">✕</button></div>`).join('')}
 <button class="btn sm gh" data-a="formAdd" data-kind="po">+ Qator qoʻshish</button>
 <label class="f">Izoh (muddat, sifat talabi va h.k.)</label><input id="f_po_note" class="inp" value="${esc(F.note)}">
 <div class="row" style="margin-top:14px"><button class="btn gold grow" data-a="formSave" data-kind="po">${ic('bell')} Zayavkani yuborish</button></div></div>`}

/* ---- Debts ---- */
function vDebts(){const ql=S.dq.toLowerCase();const all=Object.entries(S.st.debts).map(([k,d])=>({k,...d}));
 const list=all.filter(d=>(S.showZero||Math.round(d.bal)!==0)&&(!ql||d.name.toLowerCase().includes(ql)||(d.phone||'').includes(ql))).sort((a,b)=>b.bal-a.bal);
 const tot=all.reduce((a,d)=>a+Math.max(0,d.bal),0);
 return `<div class="pt"><h2>Nasiya va qarzlar daftari</h2><button class="btn pri" data-a="debtAddOpen">+ Nasiya yozish</button></div>
 <div class="kpis"><div class="kpi" style="--c:#f43f5e"><small>Jami qarzdorlik</small><b>${fm(tot)}</b><em>${all.filter(d=>d.bal>0).length} ta qarzdor</em></div></div>
 <div class="card"><div class="row" style="margin-bottom:10px"><input id="dq" class="inp grow" style="width:auto" placeholder="Ism yoki telefon…" data-in="dq" value="${esc(S.dq)}"><label class="row sm"><input id="dz" type="checkbox" ${S.showZero?'checked':''} data-ch="showZero"> Yopilganlar ham</label></div>
 <div class="tw"><table class="tbl"><tr><th>Xaridor</th><th>Telefon</th><th class="r">Qarz qoldigʻi</th><th></th></tr>
 ${list.map(d=>`<tr><td><b>${esc(d.name)}</b></td><td>${esc(d.phone||'—')}</td><td class="r b ${d.bal>0?'neg':''}">${fm(d.bal)}</td><td class="r"><button class="btn sm ok" data-a="debtPayOpen" data-k="${esc(d.k)}">Toʻlov qabul qilish</button> <button class="btn sm gh" data-a="debtHist" data-k="${esc(d.k)}">Tarix</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Qarzdor yoʻq</td></tr>'}</table></div></div>`}

/* ---- Products ---- */
function vProds(){const ql=S.sq.toLowerCase();const ps=prods().filter(p=>!ql||p.name.toLowerCase().includes(ql));
 return `<div class="pt"><h2>Mahsulotlar va narxlar</h2><button class="btn pri" data-a="prodNew">+ Yangi mahsulot</button></div>
 <div class="card"><input id="pq2" class="inp" placeholder="Qidirish…" data-in="sq" value="${esc(S.sq)}" style="margin-bottom:10px">
 ${cats().map(c=>{const xs=ps.filter(p=>p.cat===c);return xs.length?`<h3 style="margin-top:14px">${esc(c)} <span class="badge">${xs.length}</span></h3><div class="tw"><table class="tbl"><tr><th>Nomi</th><th>Oʻlchov</th><th class="r">Narx</th><th class="r">Ombor</th><th class="r">Doʻkon</th><th class="r">Min.</th><th>Holat</th></tr>${xs.map(p=>`<tr class="cl" data-a="prodEdit" data-id="${p.id}"><td><b>${esc(p.name)}</b></td><td>${esc(p.unit)}</td><td class="r b">${fm(p.price)}</td><td class="r">${fq(stockOf(p.id,'wh'))}</td><td class="r">${fq(stockOf(p.id,'shop'))}</td><td class="r mut">${p.min?fq(p.min):'—'}</td><td>${p.active===false?'<span class="badge">nofaol</span>':'<span class="badge ok">faol</span>'}</td></tr>`).join('')}</table></div>`:''}).join('')}
 ${(()=>{const xs=ps.filter(p=>!cats().includes(p.cat));return xs.length?`<h3>Kategoriyasiz</h3>${xs.map(p=>`<div class="lc cl" data-a="prodEdit" data-id="${p.id}"><b>${esc(p.name)}</b> — ${fm(p.price)}</div>`).join('')}`:''})()}
 ${!ps.length?'<div class="empty">Mahsulot yoʻq. «+ Yangi mahsulot» tugmasini bosing.</div>':''}</div>`}

/* ---- Reports ---- */
function repRange(){const p=S.rp;if(p.kind==='day')return[p.d,p.d];if(p.kind==='month'){const[y,m]=p.m.split('-').map(Number);return[p.m+'-01',p.m+'-'+pad(new Date(y,m,0).getDate())]}return[p.from,p.to]}
function vRep(){const p=S.rp;const[from,to]=repRange();const ev=rangeEvents(from);
 const head=`<div class="pt"><h2>Hisobotlar</h2><div class="seg" style="margin:0">${[['day','Kunlik'],['month','Oylik'],['range','Davr']].map(([k,t])=>`<button class="${p.kind===k?'on':''}" data-a="repKind" data-v="${k}">${t}</button>`).join('')}</div>
 ${p.kind==='day'?`<input type="date" id="rd" class="inp" style="width:auto" value="${p.d}" data-ch="repD">`:p.kind==='month'?`<input type="month" id="rm" class="inp" style="width:auto" value="${p.m}" data-ch="repM">`:`<input type="date" id="rf" class="inp" style="width:auto" value="${p.from}" data-ch="repF"><input type="date" id="rt" class="inp" style="width:auto" value="${p.to}" data-ch="repT">`}</div>`;
 if(!ev)return head+'<div class="card empty">Yuklanmoqda…</div>';
 const r=stats(ev,from,to,'all');const days=Object.entries(r.day).sort();
 const prodRows=Object.entries(r.prod).sort((a,b)=>b[1].sum-a[1].sum);const shf=shiftsOf(ev,from,to);
 const cp=id=>`<button class="btn sm gh" data-a="repCopy" data-t="${id}">${ic('copy')} Nusxa (Excel)</button>`;
 const pct=(x,t)=>t?(Math.round(x/t*1000)/10)+'%':'0%';
 return head+`<p class="mut" style="margin-top:-6px">Davr: <b>${df(from)} — ${df(to)}</b></p>
 <div class="kpis"><div class="kpi"><small>Yalpi savdo</small><b>${fm(r.gross)}</b><em>${r.n} chek</em></div><div class="kpi" style="--c:#f43f5e"><small>Qaytarishlar</small><b>${fm(r.ret)}</b></div><div class="kpi" style="--c:#22c55e"><small>Sof savdo</small><b>${fm(r.net)}</b></div>
 <div class="kpi" style="--c:#22c55e"><small>Naqd</small><b>${fm(r.cash)}</b></div><div class="kpi" style="--c:#22d3ee"><small>Karta</small><b>${fm(r.card)}</b></div><div class="kpi" style="--c:#f43f5e"><small>Nasiyaga berildi</small><b>${fm(r.debt+r.debtAdd)}</b></div>
 <div class="kpi" style="--c:#22c55e"><small>Nasiyadan undirildi</small><b>${fm(r.debtPaid)}</b><em>naqd ${fm(r.debtPaidCash)} · karta ${fm(r.debtPaidCard)}</em></div><div class="kpi" style="--c:#f59e0b"><small>Tasdiqlanmagan</small><b>${fm(r.pend)}</b></div></div>
 ${p.kind!=='day'?`<div class="card"><div class="row" style="margin-bottom:8px"><h3 style="margin:0;margin-right:auto">Kunlar boʻyicha</h3>${cp('t_days')}</div><div class="tw"><table class="tbl" id="t_days"><tr><th>Sana</th><th class="r">Cheklar</th><th class="r">Naqd</th><th class="r">Karta</th><th class="r">Nasiya</th><th class="r">Kutilmoqda</th><th class="r">Qaytarish</th><th class="r">Sof savdo</th></tr>
 ${days.map(([d,x])=>`<tr><td>${df(d)}</td><td class="r">${x.n}</td><td class="r">${fm(x.cash)}</td><td class="r">${fm(x.card)}</td><td class="r">${fm(x.debt)}</td><td class="r">${fm(x.pend)}</td><td class="r">${fm(x.ret)}</td><td class="r b">${fm(x.net)}</td></tr>`).join('')}
 <tr><td><b>JAMI</b></td><td class="r b">${r.n}</td><td class="r b">${fm(r.cash)}</td><td class="r b">${fm(r.card)}</td><td class="r b">${fm(r.debt)}</td><td class="r b">${fm(r.pend)}</td><td class="r b">${fm(r.ret)}</td><td class="r b">${fm(r.net)}</td></tr></table></div></div>`:''}
 <div class="g2"><div class="card"><div class="row" style="margin-bottom:8px"><h3 style="margin:0;margin-right:auto">Xodimlar boʻyicha</h3>${cp('t_staff')}</div><div class="tw"><table class="tbl" id="t_staff"><tr><th>Xodim</th><th class="r">Cheklar</th><th class="r">Sof savdo</th><th class="r">Ulush</th></tr>${Object.entries(r.staff).sort((a,b)=>b[1].net-a[1].net).map(([id,x])=>`<tr><td>${esc(sname(id))}</td><td class="r">${x.n}</td><td class="r b">${fm(x.net)}</td><td class="r">${pct(x.net,r.net)}</td></tr>`).join('')}</table></div></div>
 <div class="card"><div class="row" style="margin-bottom:8px"><h3 style="margin:0;margin-right:auto">Ish vaqti (smenalar)</h3>${cp('t_shift')}</div><div class="tw"><table class="tbl" id="t_shift"><tr><th>Xodim</th><th>Boshlandi</th><th>Tugadi</th><th class="r">Soat</th></tr>${shf.map(x=>`<tr><td>${esc(sname(x.staff))}</td><td>${x.start?dtm(x.start):'—'}</td><td>${x.end?dtm(x.end):'<span class="badge ok">ishda</span>'}</td><td class="r">${x.start?(((x.end||Date.now())-x.start)/3600000).toFixed(1):'—'}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Smena yoʻq</td></tr>'}</table></div></div></div>
 <div class="card"><div class="row" style="margin-bottom:8px"><h3 style="margin:0;margin-right:auto">Ombor harakati</h3>${cp('t_wh')}</div><div class="tw"><table class="tbl" id="t_wh"><tr><th>Mahsulot</th><th class="r">Omborga kirim</th><th class="r">Doʻkonga oʻtdi</th><th class="r">Sotildi</th><th class="r">Hozirgi qoldiq</th></tr>
 ${prods().filter(x=>r.whIn[x.id]||r.trans[x.id]||r.prod[x.id]).map(x=>{const t=r3(stockOf(x.id,'wh')+stockOf(x.id,'shop'));return `<tr><td>${esc(x.name)}</td><td class="r">${fq(r.whIn[x.id]||0)}</td><td class="r">${fq(r.trans[x.id]||0)}</td><td class="r">${fq(r.prod[x.id]?.q||0)}</td><td class="r b ${t<0?'neg':''}">${fq(t)} ${esc(x.unit)}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">Harakat yoʻq</td></tr>'}</table></div></div>
 <div class="card"><div class="row" style="margin-bottom:8px"><h3 style="margin:0;margin-right:auto">Mahsulotlar boʻyicha savdo</h3>${cp('t_prod')}</div><div class="tw"><table class="tbl" id="t_prod"><tr><th>Mahsulot</th><th>Kategoriya</th><th class="r">Miqdor</th><th class="r">Summa</th><th class="r">Ulush</th></tr>
 ${prodRows.map(([id,x])=>`<tr><td>${esc(x.n)}</td><td class="mut">${esc(prod(id)?.cat||'')}</td><td class="r">${fq(x.q)} ${esc(x.u)}</td><td class="r b">${fm(x.sum)}</td><td class="r">${pct(x.sum,r.net)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Savdo yoʻq</td></tr>'}</table></div></div>`}

 <div class="card"><div class="tw"><table class="tbl"><tr><th>Ism</th><th>Lavozim</th><th>Smena</th><th>PIN</th><th>Qurilmalar</th><th></th></tr>

 <td>${lk?`<span class="badge an">bloklangan</span> <button class="btn sm gh" data-a="secUnlock" data-id="${s.id}">Blokdan chiqarish</button>`:S.pins[s.id]?'<span class="badge ok">oʻrnatilgan</span>':'<span class="badge wr">birinchi kirishda</span>'}</td>

/* ========== ZIP + archive ========== */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
async function streamBytes(u,fmt,de){const cs=de?new DecompressionStream(fmt):new CompressionStream(fmt);const w=cs.writable.getWriter();w.write(u);w.close();return new Uint8Array(await new Response(cs.readable).arrayBuffer())}
async function makeZip(files){const enc=new TextEncoder();const parts=[],central=[];let off=0;const d=new Date();
 const dt=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dd=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
 for(const f of files){const nm=enc.encode(f.name);const raw=typeof f.data==='string'?enc.encode(f.data):f.data;const crc=crc32(raw);
  let comp=null,method=8;try{if(typeof CompressionStream!=='undefined')comp=await streamBytes(raw,'deflate-raw')}catch(e){comp=null}
  if(!comp||comp.length>=raw.length){comp=raw;method=0}
  const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,method,true);lh.setUint16(10,dt,true);lh.setUint16(12,dd,true);lh.setUint32(14,crc,true);lh.setUint32(18,comp.length,true);lh.setUint32(22,raw.length,true);lh.setUint16(26,nm.length,true);
  parts.push(new Uint8Array(lh.buffer),nm,comp);
  const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,method,true);ch.setUint16(12,dt,true);ch.setUint16(14,dd,true);ch.setUint32(16,crc,true);ch.setUint32(20,comp.length,true);ch.setUint32(24,raw.length,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
  central.push(new Uint8Array(ch.buffer),nm);off+=30+nm.length+comp.length}
 const csz=central.reduce((a,b)=>a+b.length,0);const end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,csz,true);end.setUint32(16,off,true);
 return new Blob([...parts,...central,new Uint8Array(end.buffer)],{type:'application/zip'})}
const csv=rows=>'﻿'+rows.map(r=>r.map(x=>{const s=String(x??'');return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(';')).join('\r\n');
const nf=n=>String(Math.round((+n||0)*1000)/1000).replace('.',',');
function monthRange(m){const[y,mm]=m.split('-').map(Number);return[m+'-01',m+'-'+pad(new Date(y,mm,0).getDate())]}
async function monthEvents(m){const[from,to]=monthRange(m);const docs=await Store.getJ(from,to>today()?today():addD(to,0));const mp=flatDocs(docs);
 for(const k in S.myJ){const j=S.myJ[k];if(j.date>=from&&j.date<=to)j.events.forEach(e=>mp.set(e.id,e))}
 S.events.forEach(e=>{if(e.date>=from&&e.date<=to)mp.set(e.id,e)});
 return{from,to,evs:[...mp.values()].sort((a,b)=>a.t-b.t)}}
async function buildArchive(m){const{from,to,evs}=await monthEvents(m);const r=stats(evs,from,to,'all');const sales=Object.values(buildSales(evs)).filter(s=>s.date>=from&&s.date<=to).sort((a,b)=>a.t-b.t);
 const status=s=>s.status==='void'?'Bekor':s.pay.mode==='main'&&!s.confirmed?'Kutilmoqda':'OK';
 const f=[];
 f.push({name:'savdolar.csv',data:csv([['Sana','Vaqt','Chek №','Xodim','Manba','Xaridor','Summa','Qaytarilgan','Sof','Toʻlov turi','Nasiyachi','Holat','Tahrirlar'],...sales.map(s=>[df(s.date),tm(s.t),s.no,sname(s.by),s.src==='wh'?'Ombor':'Doʻkon',s.cust,s.total,s.returned,s.total-s.returned,MET[s.method]||'',s.debtor?.name||'',status(s),s.edits])])});
 f.push({name:'savdo_qatorlari.csv',data:csv([['Sana','Chek №','Xodim','Mahsulot','Miqdor','Birlik','Narx','Summa'],...sales.flatMap(s=>s.items.map(i=>[df(s.date),s.no,sname(s.by),i.n,nf(i.q),i.u,i.pr,Math.round(i.q*i.pr)]))])});
 f.push({name:'ombor_harakati.csv',data:csv([['Sana','Vaqt','Turi','Xodim','Mahsulot','Miqdor','Izoh'],...evs.filter(e=>['wh_in','transfer_ok','adjust'].includes(e.type)&&e.date>=from).flatMap(e=>e.type==='adjust'?[[df(e.date),tm(e.t),'Tuzatish ('+(e.loc==='wh'?'ombor':'doʻkon')+')',sname(e.by),prod(e.p)?.name||e.p,nf(e.q),e.reason||'']]:e.items.map(i=>[df(e.date),tm(e.t),e.type==='wh_in'?'Omborga kirim':'Doʻkonga oʻtkazish',sname(e.by),i.n,nf(i.q),e.note||'']))])});
 f.push({name:'nasiya.csv',data:csv([['Sana','Turi','Xaridor','Telefon','Summa'],...evs.filter(e=>e.date>=from).flatMap(e=>e.type==='debt_pay'?[[df(e.date),'Toʻlov',e.debtor.name,e.debtor.phone||'',-e.amount]]:e.type==='debt_add'?[[df(e.date),'Qoʻlda',e.debtor.name,e.debtor.phone||'',e.amount]]:e.type==='sale'&&e.pay.method==='debt'&&e.pay.mode==='self'?[[df(e.date),'Savdo #'+e.no,e.pay.debtor.name,e.pay.debtor.phone||'',e.total]]:e.type==='confirm'&&e.method==='debt'&&e.mode==='main'?[[df(e.date),'Bosh kassa',e.debtor.name,e.debtor.phone||'',e.amount]]:[])])});
 f.push({name:'smenalar.csv',data:csv([['Xodim','Boshlandi','Tugadi','Soat'],...shiftsOf(evs,from,to).map(x=>[sname(x.staff),x.start?dtm(x.start):'',x.end?dtm(x.end):'',x.start&&x.end?((x.end-x.start)/3600000).toFixed(2).replace('.',','):''])])});
 f.push({name:'qoldiq.csv',data:csv([['Mahsulot','Kategoriya','Birlik','Omborda','Doʻkonda','Narx'],...prods().map(p=>[p.name,p.cat,p.unit,nf(stockOf(p.id,'wh')),nf(stockOf(p.id,'shop')),p.price])])});
 const sum={oy:m,davr:[from,to],cheklar:r.n,yalpi:r.gross,qaytarish:r.ret,sof:r.net,naqd:r.cash,karta:r.card,nasiya:r.debt,kutilmoqda:r.pend,nasiya_undirildi:r.debtPaid,xodimlar:Object.fromEntries(Object.entries(r.staff).map(([k,v])=>[sname(k),v])),yaratildi:new Date().toISOString(),doʻkon:shopName()};
 f.push({name:'hisobot.json',data:JSON.stringify(sum,null,2)});
 f.push({name:'jurnal.json',data:JSON.stringify(evs)});
 return{files:f,sum,evs,r}}
async function saveFile(name,blob){if(IS_APP&&AndroidBridge.saveFile){try{const u=new Uint8Array(await blob.arrayBuffer());AndroidBridge.saveFile(name,b64(u),blob.type||'application/zip');toast('Saqlandi: Download papkasida — '+esc(name),'ok');return true}catch(e){toast('Saqlab boʻlmadi: '+esc(e.message||e),'err');return false}}
 if(Store.dl){try{await Store.dl.save({filename:name,data:blob});return true}catch(e){if(e&&e.code==='declined')return false;toast('Yuklab boʻlmadi: '+esc(e.message||e.code),'err');return false}}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();return true}catch(e){toast('Yuklab olish bu oynada mavjud emas','err');return false}}
const b64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
async function storeArchive(m,silent){try{const{sum,evs,r}=await buildArchive(m);let raw=new TextEncoder().encode(JSON.stringify(evs));let gz=raw,enc='none';
  try{if(typeof CompressionStream!=='undefined'){gz=await streamBytes(raw,'gzip');enc='gzip'}}catch(e){}
  const s=b64(gz);const CH=180000;const n=Math.ceil(s.length/CH)||1;
  for(let i=0;i<n;i++)await Store.set(`archp/${m}_${i}`,{m,i,enc,data:s.slice(i*CH,(i+1)*CH)});
  await Store.set('arch/'+m,{m,at:Date.now(),by:S.me.id,parts:n,enc,bytes:gz.length,raw:raw.length,sum:{n:r.n,net:r.net,cash:r.cash,card:r.card,debt:r.debt}});
  if(!silent)toast(`${m} arxivi bazaga saqlandi (${(gz.length/1024).toFixed(1)} KB)`,'ok')}catch(e){console.warn(e);if(!silent)toast('Arxivlab boʻlmadi: '+esc(e.message||e.code||e),'err')}}
let archChecked=false;
function maybeArchive(){if(!isAdmin()||archChecked||!S.archLoaded)return;archChecked=true;const prev=S.am;if(!S.arch.find(a=>a._id===prev)&&today().slice(8)>='01')storeArchive(prev,true)}

/* ========== actions ========== */
function curCart(){const src=S.modal?.src||srcOfView();const C=cartsOf(src);return{src,C,c:C.list[C.act]}}
function availInCart(pid,src,c,exceptK){let used=0;c.items.forEach((i,k)=>{if(i.p===pid&&k!==exceptK)used+=i.q});return r3(stockOf(pid,src)-used)}
function openQty(pid,k){const{src,c}=curCart();const p=prod(pid);const it=k>=0?c.items[k]:null;const av=availInCart(pid,src,c,k);
 if(!it&&av<=0){toast(`<b>${esc(p.name)}</b> — ${src==='wh'?'omborda':'doʻkonda'} tovar mavjud emas. Sotish imkoni yoʻq.`,'err');if(src==='shop')autoRestock([pid]);return}
 openM({type:'qty',src,pid,k:k??-1,prodInfo:p,pr:it?it.pr:p.price,val:it?String(it.q):'',mode:'q',avail:av})}
function autoRestock(pids){const P=S.st.pend.rs;for(const pid of pids){const p=prod(pid);if(!p)continue;const sh=stockOf(pid,'shop'),wh=stockOf(pid,'wh');
  if(sh<=(p.min||0)&&wh>0&&!P[pid]){emit('restock_req',{p:pid,n:p.name,shop:sh,wh});if(!isAdmin()&&S.me.role!=='wh')toast(`Doʻkonda ${esc(p.name)} tugadi — omborga zayavka yuborildi`,'')}}}
async function hpin(id,pin){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('pos:'+id+':'+pin));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=7;for(const ch of id+':'+pin)h=(h*31+ch.charCodeAt(0))|0;return 'x'+h}}

async function pinFail(m){const s=m.staff;const cur=S.sec[s.id]||{fails:0};const fails=(cur.fails||0)+1;
 if(fails>=MAXFAIL){const d={fails:0,lockUntil:Date.now()+LOCKMIN*60000,at:Date.now(),dev:DEV};S.sec[s.id]=d;await Store.set('sec/'+s.id,d).catch(()=>{});alertAdd('pin_lock',`${s.name}: ${MAXFAIL} marta xato PIN — ${LOCKMIN} daqiqaga bloklandi`,s.id)}
 else{const d={fails,lockUntil:0,at:Date.now(),dev:DEV};S.sec[s.id]=d;Store.set('sec/'+s.id,d).catch(()=>{})}
 m.val='';m.bad=fails>=MAXFAIL?'':`PIN notoʻgʻri (${fails}/${MAXFAIL})`;render()}
function finalize(mode,method,debtor){const src=S.modal.src;const C=cartsOf(src),c=C.list[C.act];if(!c.items.length)return;
 const short=[];const need={};c.items.forEach(i=>need[i.p]=r3((need[i.p]||0)+i.q));

 prodSave(){const m=S.modal;const name=val('pp_n').trim(),price=Math.round(num(val('pp_p')));if(!name||price<=0)return toast('Nom va narxni kiriting','err');
  const list=clone(prods());const p={...m.p,name,cat:val('pp_c'),unit:val('pp_u'),price,min:r3(num(val('pp_min'))),active:m.p.id?!!document.getElementById('pp_a')?.checked:true};
  if(p.id){const i=list.findIndex(x=>x.id===p.id);list[i]=p}else{p.id='p'+uid();list.push(p)}
  S.cfg.products={list};saveProducts(list);S.modal=null;toast('Saqlandi','ok');render()},
 staffNew(){openM({type:'staff',s:{role:'cashier'}})},
 staffEdit(d){openM({type:'staff',s:clone(staffBy(d.id))})},
 staffSave(){const m=S.modal;const name=val('sf_n').trim();if(!name)return toast('Ismni kiriting','err');const list=clone(staffL());
  const s={...m.s,name,role:m.s.id===S.me.id?'admin':val('sf_r'),active:m.s.active!==false};
  if(s.id){list[list.findIndex(x=>x.id===s.id)]=s}else{s.id='s'+uid();s.devs=[];list.push(s)}
  S.cfg.staff={list};saveStaff(list);if(s.id===S.me.id)S.me=s;S.modal=null;toast('Saqlandi','ok');render()},
 staffPin(d){const s=staffBy(d.id);ask('PIN tiklash',`<b>${esc(s.name)}</b> PIN-kodi oʻchirilsinmi? Keyingi kirishda yangisini oʻrnatadi.`,()=>{Store.del('pins/'+s.id);delete S.pins[s.id]},'Tiklash')},
 staffToggle(d){const list=clone(staffL());const s=list.find(x=>x.id===d.id);const deact=s.active!==false;
  const go=()=>{s.active=!deact;if(deact)s.devs=[];S.cfg.staff={list};saveStaff(list);if(deact){if(S.shift[s.id]?.open)setShift(s.id,false,S.shift[s.id].dev);Store.del('pins/'+s.id);delete S.pins[s.id]}render()};
  if(deact)ask('Ishdan boʻshatish',`<b>${esc(s.name)}</b> ilovadan foydalana olmaydi: smenasi yopiladi, PIN va qurilmalari oʻchiriladi. Tarixiy maʼlumotlar saqlanadi.`,go,'Tasdiqlash',true);else go()},
 setSave(){const shop=val('st_shop').trim();const cs=val('st_cats').split('\n').map(x=>x.trim()).filter(Boolean);if(!cs.length)return toast('Kamida bitta kategoriya','err');
  const s={...(S.cfg.settings||{}),shop,cats:cs};S.cfg.settings=s;Store.set('cfg/settings',s).then(()=>toast('Saqlandi','ok')).catch(e=>toast('Saqlanmadi','err'));render()},
 idleSave(){const idle={admin:+val('idle_admin'),cashier:+val('idle_cashier'),wh:+val('idle_wh')};const s={...(S.cfg.settings||{}),idle};S.cfg.settings=s;Store.set('cfg/settings',s).then(()=>toast('Avto-qulf vaqti saqlandi','ok')).catch(()=>toast('Saqlanmadi','err'));S.lastAct=Date.now();render()},
 monDay(d){S.mon.date=addD(today(),+d.v);render()},
 monStaffSet(d){S.mon.staff=S.mon.staff===d.id?'all':d.id;render()},
 monSort(d){S.mon.sort=d.v;render()},
 repKind(d){S.rp.kind=d.v;render()},
 repCopy(d){copyText(tsvOf(d.t),'Nusxalandi — Excelga qoʻying')},
 async zipDl(b,el){el.disabled=true;el.textContent='Tayyorlanmoqda…';try{const{files}=await buildArchive(S.am);const blob=await makeZip(files);
   const ok=await saveFile(`${APP}_${(shopName()).replace(/[^\wʻ' -]/g,'').replace(/\s+/g,'_')}_${S.am}.zip`,blob);if(ok)toast('ZIP arxiv tayyor','ok')}catch(e){console.warn(e);toast('Xato: '+esc(e.message||e),'err')}render()},
 async archStore(b,el){el.disabled=true;el.textContent='Saqlanmoqda…';await storeArchive(S.am);render()}};
function syncEdit(){const m=S.modal;m.items.forEach((i,k)=>{const q=document.getElementById('e_q_'+k),p=document.getElementById('e_p_'+k);if(q)i.q=q.value;if(p)i.pr=p.value})}
const IN={q(v){S.q=v;render()},sq(v){S.sq=v;render()},dq(v){S.dq=v;render()},mq(v){S.mq=v;render()}};
const CH={monDate(v){if(v){S.mon.date=v;render()}},monStaff(v){S.mon.staff=v;render()},sfDate(v){if(v){S.sf.date=v;render()}},sfStaff(v){S.sf.staff=v;render()},sfSt(v){S.sf.st=v;render()},
 showZero(v,el){S.showZero=el.checked;render()},repD(v){if(v){S.rp.d=v;render()}},repM(v){if(v){S.rp.m=v;render()}},repF(v){if(v){S.rp.from=v;render()}},repT(v){if(v){S.rp.to=v;render()}},arM(v){S.am=v;render()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=A[b.dataset.a];if(!f)return;
 if(b.dataset.a==='mClose'&&e.target!==b&&!e.target.closest('.btn'))return;
 if(b.dataset.a!=='noop')e.preventDefault();f(b.dataset,b)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el)IN[el.dataset.in]?.(el.value,el)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el)CH[el.dataset.ch]?.(el.value,el)});
document.addEventListener('keydown',e=>{const m=S.modal;if(!m)return;if(e.key==='Escape'){closeM();return}
 if(m.type==='pin'){if(/^\d$/.test(e.key))A.pinKey({v:e.key});else if(e.key==='Backspace')A.pinKey({v:'del'});return}
 if(m.type==='qty'&&!(e.target.tagName==='INPUT')){if(/^\d$/.test(e.key))A.kp({v:e.key});else if(e.key==='.'||e.key===',')A.kp({v:'.'});else if(e.key==='Backspace')A.kp({v:'del'});else if(e.key==='Enter')A.kpOk();}});

/* ========== boot ========== */
let bootT=null;
function onData(){
 if(!S.loaded&&Object.values(S.cfg).every(v=>v!==undefined)&&S.pins!==undefined&&S.liveLoaded){S.loaded=true;S.loadWarn=false;clearTimeout(bootT)}
 if(S.loaded){const id=LSget('pos_me_'+DEV,null);if(!S.me&&id){const s=staffL().find(x=>x.id===id&&x.active!==false);if(s){S.me=s;S.locked=true;maybeClose()}}
  if(S.me){const s=staffBy(S.me.id);if(!s||s.active===false){S.me=null;S.locked=false;LSset('pos_me_'+DEV,null)}else S.me=s}}
 recompute();render()}
window.__back=function(){if(S.modal){closeM();return true}if(S.cartOpen){S.cartOpen=false;render();return true}
 if(S.me&&!S.locked&&shiftOk()){const f=PRIMARY[S.me.role][0];if(S.view!==f){A.go({v:f});return true}}return false};
if(STANDALONE&&!IS_APP){const l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);
 const a=document.createElement('link');a.rel='apple-touch-icon';a.href='icons/icon-192.png';document.head.appendChild(a);
 if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
async function boot(){render();await Store.init();if(Store.mode==='connect'){S.loaded=true;render();return}S.sync=Store.mode==='db'?'on':'local';
 bootT=setTimeout(()=>{if(!S.loaded){S.loaded=true;S.loadWarn=true;['settings','products','staff'].forEach(k=>{if(S.cfg[k]===undefined)S.cfg[k]=null});if(S.pins===undefined)S.pins={};if(S.cfg.close===undefined){S.cfg.close=null;restartLive()}onData()}},12000);
 ['settings','products','staff','close'].forEach(n=>Store.subDoc('cfg/'+n,d=>{S.cfg[n]=d;if(n==='close'){restartLive();if(S.loaded)maybeClose()}onData()}));
 Store.subCol('pins',docs=>{S.pins={};docs.forEach(d=>S.pins[d._id]=d.h);onData()});
 Store.subCol('shift',docs=>{const was=shiftOk();S.shift={};docs.forEach(d=>S.shift[d._id]=d);if(S.me&&was&&!shiftOk()){toast('Smenangiz yopildi — ilova qulflandi','err');flushAll()}onData()});
 Store.subCol('shreq',docs=>{S.shreq={};docs.forEach(d=>S.shreq[d._id]=d);onData()});
 Store.subCol('sec',docs=>{S.sec={};docs.forEach(d=>S.sec[d._id]=d);render()});
 Store.subCol('alerts',docs=>{S.alerts=docs;notify();render()});
 Store.subCol('pres',docs=>{S.pres=docs;render()});
 Store.subCol('arch',docs=>{S.arch=docs;S.archLoaded=true;maybeArchive();render()});
 setInterval(()=>{if(S.me)render()},60000)}
boot();
</script>
